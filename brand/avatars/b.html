<!doctype html>
<!-- 方案 B：单字印章（羽），米白底 + 圆形描边 + 右上红点 -->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:800px;height:800px;background:#FBF9F4;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans SC",sans-serif}
  .ring{width:620px;height:620px;border:16px solid #12100E;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:#FBF9F4}
  .ch{font-size:330px;font-weight:900;color:#12100E;line-height:1;letter-spacing:-6px}
  .dot{position:absolute;top:64px;right:96px;width:52px;height:52px;border-radius:50%;background:#E8452B}
</style></head><body>
  <div class="ring"><div class="ch">羽</div><div class="dot"></div></div>
</body></html>
