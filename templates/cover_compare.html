<!doctype html>
<!-- 对比型封面：前后 / 手工 vs 自动。由 render_cover.py 填充 -->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1242px;height:1656px;font-family:"Noto Sans SC",sans-serif;background:#F2F4F7;color:#101828;overflow:hidden}
  .pad{padding:110px 96px;height:100%;display:flex;flex-direction:column}
  .tag{display:inline-block;font-size:38px;font-weight:500;color:#667085;letter-spacing:2px;border:3px solid #D0D5DD;border-radius:999px;padding:14px 34px;align-self:flex-start}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:46px}
  .h{font-size:100px;font-weight:900;line-height:1.24;letter-spacing:-2px;word-break:break-word}
  .row{display:flex;gap:28px}
  .card{flex:1;border-radius:36px;padding:52px 44px;display:flex;flex-direction:column;gap:18px}
  .card.bad{background:#FFFFFF;border:4px solid #EAECF0}
  .card.good{background:#101828;color:#F9FAFB}
  .lab{font-size:36px;font-weight:700;letter-spacing:3px;color:#98A2B3}
  .card.good .lab{color:#7DD3A0}
  .num{font-weight:900;letter-spacing:-2px;word-break:break-word}
  .desc{font-size:38px;font-weight:500;line-height:1.5;color:#667085}
  .card.good .desc{color:#C8CED8}
  .foot{font-size:40px;color:#98A2B3;border-top:3px solid #D0D5DD;padding-top:34px;display:flex;justify-content:space-between}
</style></head><body><div class="pad">
  <div class="tag">{{tag}}</div>
  <div class="mid">
    <div class="h" style="font-size:{{title_size}}px;line-height:{{title_lh}}">{{title_html}}</div>
    <div class="row">
      <div class="card bad"><div class="lab">{{bad_lab}}</div><div class="num" style="font-size:{{num_size}}px">{{bad_num}}</div><div class="desc">{{bad_desc}}</div></div>
      <div class="card good"><div class="lab">{{good_lab}}</div><div class="num" style="font-size:{{num_size}}px">{{good_num}}</div><div class="desc">{{good_desc}}</div></div>
    </div>
  </div>
  <div class="foot"><span>{{foot_left}}</span><span>{{foot_right}}</span></div>
</div></body></html>
